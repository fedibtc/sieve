[package]
name = "sieve"
version = "0.2.0"
edition = "2021"
description = "CLI transport for publishing and consuming Sieve reviews"
repository = "https://github.com/fedibtc/sieve"

[[bin]]
name = "sieve"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6.0"
hex = "0.4"
is-terminal = "0.4"
jsonschema = "0.18"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.15"
thiserror = "2.0"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"

[profile.dist]
inherits = "release"
lto = "thin"
