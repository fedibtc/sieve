"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "nix develop --command corepack pnpm install"
run_mode = "nonconcurrent"

[scripts.run.dev]
command = "BETTER_AUTH_URL=http://localhost:3000 nix develop --command corepack pnpm dev --port 3000"
default = true
icon = "play"
